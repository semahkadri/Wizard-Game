<!DOCTYPE html>
<html>
<head>
    <title>WIZZARA · Icon Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="background:#0a0700;color:#d4aa55;font-family:'Cinzel',serif;padding:2rem;text-align:center;min-height:100vh">

<h1 style="color:#d4aa55;font-weight:900;letter-spacing:8px;font-size:1.8rem;margin-bottom:0.5rem">WIZZARA</h1>
<p style="color:#8C8676;font-size:0.85rem;letter-spacing:2px;margin-bottom:0.5rem">ICON GENERATOR · GOLD ON BLACK · 4-SUIT MOTIF</p>
<p style="color:#5C5849;font-size:0.75rem;margin-bottom:2rem">Click <strong style="color:#c9a832">DOWNLOAD ALL</strong>, then move PNGs into the <code style="color:#c9a832">icons/</code> folder.</p>

<div id="buttons" style="display:flex;flex-wrap:wrap;gap:0.75rem;margin:2rem auto;max-width:780px;justify-content:center"></div>

<canvas id="canvas" style="border:2px solid rgba(201,168,50,0.4);border-radius:24px;margin:1.5rem auto;display:block;box-shadow:0 0 40px rgba(201,168,50,0.2)"></canvas>

<script>
// ─── Icon sizes ───
const pwaSizes      = [72, 96, 128, 144, 152, 192, 384, 512];
const appleSizes    = [120, 152, 167, 180];
const faviconSizes  = [16, 32];

// ─── WIZZARA palette ───
const PAL = {
    bgDeep   : '#0a0700',
    bgMid    : '#1a1100',
    bgGlow   : '#2a1a04',
    goldHi   : '#e0c060',
    goldMain : '#c9a832',
    goldDeep : '#9a7d1c',
    suitR    : '#c23030',
    suitG    : '#c9a832',
    suitV    : '#3a8c3a',
    suitB    : '#2455a4',
    txtDark  : '#0a0700'
};

/**
 * Draw a premium WIZZARA icon — dark medallion with gold W and 4-suit ring.
 * Single drawing function scales to any size; details are added/removed
 * automatically based on the rendered px.
 */
function drawIcon(canvas, size) {
    canvas.width  = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const R = size;
    const cx = R/2, cy = R/2;

    // ─── 1. Dark medallion background with subtle gold glow at centre ───
    const bg = ctx.createRadialGradient(cx, cy*0.85, 0, cx, cy, R*0.55);
    bg.addColorStop(0, PAL.bgGlow);
    bg.addColorStop(0.45, PAL.bgMid);
    bg.addColorStop(1, PAL.bgDeep);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(cx, cy, R/2, 0, Math.PI * 2);
    ctx.fill();

    // ─── 2. Outer gold ring (strong) ───
    const ringW = Math.max(2, size * 0.04);
    ctx.strokeStyle = PAL.goldMain;
    ctx.lineWidth = ringW;
    ctx.beginPath();
    ctx.arc(cx, cy, R/2 - ringW/2 - 1, 0, Math.PI * 2);
    ctx.stroke();

    // ─── 3. Inner decorative ring (subtle, ouroboros suggestion) ───
    ctx.strokeStyle = 'rgba(201,168,50,0.32)';
    ctx.lineWidth = Math.max(1, size * 0.008);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.42, 0, Math.PI * 2);
    ctx.stroke();

    // Even more inner ring for sizes ≥ 96
    if (size >= 96) {
        ctx.strokeStyle = 'rgba(201,168,50,0.18)';
        ctx.lineWidth = Math.max(0.5, size * 0.004);
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.395, 0, Math.PI * 2);
        ctx.stroke();
    }

    // ─── 4. Four suit-colour diamonds around the perimeter (sizes ≥ 96) ───
    if (size >= 96) {
        const suitColors = [PAL.suitR, PAL.suitG, PAL.suitV, PAL.suitB];
        const suitR = size * 0.045;
        const ringR = R * 0.43;
        // 0°, 90°, 180°, 270° (top, right, bottom, left)
        const angles = [-Math.PI/2, 0, Math.PI/2, Math.PI];
        for (let i = 0; i < 4; i++) {
            const a = angles[i];
            const px = cx + ringR * Math.cos(a);
            const py = cy + ringR * Math.sin(a);
            // Diamond
            ctx.fillStyle = suitColors[i];
            ctx.beginPath();
            ctx.moveTo(px, py - suitR);
            ctx.lineTo(px + suitR*0.7, py);
            ctx.lineTo(px, py + suitR);
            ctx.lineTo(px - suitR*0.7, py);
            ctx.closePath();
            ctx.fill();
            // Stroke for elegance
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = Math.max(0.5, size * 0.003);
            ctx.stroke();
        }
    }

    // ─── 5. Gold "W" centrepiece in Cinzel ───
    const fontSize = size * 0.50;
    ctx.font = `900 ${fontSize}px 'Cinzel', 'Trajan Pro', 'Times New Roman', serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Soft drop shadow for depth
    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
    ctx.shadowBlur = size * 0.06;
    ctx.shadowOffsetY = size * 0.018;

    // Gold linear gradient on the letter
    const txtGrad = ctx.createLinearGradient(R*0.25, R*0.20, R*0.75, R*0.80);
    txtGrad.addColorStop(0, PAL.goldHi);
    txtGrad.addColorStop(0.45, PAL.goldMain);
    txtGrad.addColorStop(1, PAL.goldDeep);
    ctx.fillStyle = txtGrad;
    ctx.fillText('W', cx, cy + fontSize * 0.02);

    // Reset shadow
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // ─── 6. WIZZARA wordmark below W (sizes ≥ 192 only) ───
    if (size >= 192) {
        const wmSize = Math.max(8, size * 0.07);
        ctx.font = `700 ${wmSize}px 'Cinzel', serif`;
        ctx.fillStyle = 'rgba(201,168,50,0.7)';
        ctx.textAlign = 'center';
        // Letter-spacing emulation: draw char by char
        const word = 'WIZZARA';
        const tracking = wmSize * 0.18;
        const totalW = word.length * (wmSize * 0.55) + (word.length - 1) * tracking;
        let x = cx - totalW/2;
        for (let i = 0; i < word.length; i++) {
            ctx.fillText(word[i], x + (wmSize * 0.55)/2, cy + R*0.32);
            x += wmSize * 0.55 + tracking;
        }
    }

    // ─── 7. Tiny tagline dot ornament between W and wordmark (sizes ≥ 384) ───
    if (size >= 384) {
        ctx.fillStyle = 'rgba(201,168,50,0.5)';
        const dotR = size * 0.008;
        ctx.beginPath();
        ctx.arc(cx, cy + R*0.255, dotR, 0, Math.PI * 2);
        ctx.fill();
    }
}

function downloadIcon(size, prefix) {
    const c = document.createElement('canvas');
    drawIcon(c, size);
    const a = document.createElement('a');
    a.download = `${prefix}${size}x${size}.png`;
    a.href = c.toDataURL('image/png');
    a.click();
}

const container = document.getElementById('buttons');

// ─── DOWNLOAD ALL button (prominent) ───
const allBtn = document.createElement('button');
allBtn.textContent = '↓ DOWNLOAD ALL ICONS';
allBtn.style.cssText = "font-family:'Cinzel',serif;padding:1rem 2.5rem;background:linear-gradient(135deg,#e0c060,#c9a832,#9a7d1c);color:#0a0700;border:none;border-radius:8px;cursor:pointer;font-weight:900;font-size:1rem;letter-spacing:3px;width:100%;box-shadow:0 6px 24px rgba(201,168,50,0.4);text-transform:uppercase;transition:all 0.2s";
allBtn.onmouseover = function(){ this.style.transform = 'translateY(-2px)'; this.style.boxShadow = '0 8px 32px rgba(201,168,50,0.55)'; };
allBtn.onmouseout = function(){ this.style.transform=''; this.style.boxShadow='0 6px 24px rgba(201,168,50,0.4)'; };
allBtn.onclick = () => {
    let delay = 0;
    pwaSizes.forEach(s => { setTimeout(() => downloadIcon(s, 'icon-'), delay); delay += 200; });
    appleSizes.forEach(s => { setTimeout(() => downloadIcon(s, 'apple-touch-icon-'), delay); delay += 200; });
    faviconSizes.forEach(s => { setTimeout(() => downloadIcon(s, 'favicon-'), delay); delay += 200; });
};
container.appendChild(allBtn);

// ─── Individual size buttons ───
const note = document.createElement('p');
note.style.cssText = "font-family:'Cinzel',serif;width:100%;color:#5C5849;font-size:0.75rem;letter-spacing:1.5px;margin:0.5rem 0;text-transform:uppercase";
note.textContent = '· OR DOWNLOAD INDIVIDUALLY ·';
container.appendChild(note);

const allSizes = [...pwaSizes, ...appleSizes.map(s => ({n: s, p: 'apple-touch-icon-'})), ...faviconSizes.map(s => ({n: s, p: 'favicon-'}))];

[...pwaSizes].forEach(size => {
    const btn = document.createElement('button');
    btn.textContent = `${size}`;
    btn.style.cssText = "font-family:'Cinzel',serif;padding:0.5rem 1rem;background:rgba(201,168,50,0.08);color:#c9a832;border:1px solid rgba(201,168,50,0.3);border-radius:6px;cursor:pointer;font-weight:700;font-size:0.85rem;letter-spacing:1px;transition:all 0.15s";
    btn.onmouseover = function(){ this.style.background = 'rgba(201,168,50,0.18)'; this.style.borderColor = 'rgba(201,168,50,0.6)'; };
    btn.onmouseout = function(){ this.style.background = 'rgba(201,168,50,0.08)'; this.style.borderColor = 'rgba(201,168,50,0.3)'; };
    btn.onclick = () => downloadIcon(size, 'icon-');
    container.appendChild(btn);
});

// Apple touch icon buttons (smaller, different color)
const appleNote = document.createElement('p');
appleNote.style.cssText = "font-family:'Cinzel',serif;width:100%;color:#5C5849;font-size:0.7rem;letter-spacing:1.5px;margin:0.5rem 0;text-transform:uppercase";
appleNote.textContent = '· APPLE TOUCH ·';
container.appendChild(appleNote);

appleSizes.forEach(size => {
    const btn = document.createElement('button');
    btn.textContent = `A${size}`;
    btn.style.cssText = "font-family:'Cinzel',serif;padding:0.4rem 0.8rem;background:rgba(74,127,75,0.1);color:#7a9d7a;border:1px solid rgba(74,127,75,0.3);border-radius:6px;cursor:pointer;font-weight:600;font-size:0.75rem";
    btn.onclick = () => downloadIcon(size, 'apple-touch-icon-');
    container.appendChild(btn);
});

// Preview at 320px
drawIcon(document.getElementById('canvas'), 320);
</script>

<p style="color:#5C5849;font-size:0.7rem;letter-spacing:2px;margin-top:2rem;text-transform:uppercase">© 2026 WIZZARA · S3mah · Made in Tunisia</p>
</body>
</html>
